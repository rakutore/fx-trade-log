<style>

<script>
// ---- DB ----
let db;
const DB_NAME = 'moneylog_db';
const STORE = 'trades';

function initDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        const s = d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'date');
      }
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = rej;
  });
}

function getAllTrades() {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result.sort((a,b) => b.date.localeCompare(a.date)));
    req.onerror = rej;
  });
}

function saveTrade(trade) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add(trade);
    req.onsuccess = () => res(req.result);
    req.onerror = rej;
  });
}

function deleteTrade(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = res;
    req.onerror = rej;
  });
}

// ---- UTILS ----
function fmtYen(v) {
  const abs = Math.abs(v);
  const s = abs.toLocaleString('ja-JP');
  return (v >= 0 ? '+¥' : '-¥') + s;
}
function colorClass(v) { return v >= 0 ? 'pos' : 'neg'; }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ---- DATE ----
const today = new Date();
document.getElementById('headerDate').textContent =
  `${today.getMonth()+1}月${today.getDate()}日(${['日','月','火','水','木','金','土'][today.getDay()]})`;

// ---- NAV ----
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    if (btn.dataset.page === 'home') renderHome();
    if (btn.dataset.page === 'cal') renderCalendar();
  });
});

// ---- HOME ----
async function renderHome() {
  const trades = await getAllTrades();
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const monthStr = `${year}-${String(month).padStart(2,'0')}`;

  const yearTrades = trades.filter(t => t.date.startsWith(String(year)));
  const monthTrades = trades.filter(t => t.date.startsWith(monthStr));
  const yearTotal = yearTrades.reduce((s,t) => s+t.amount, 0);
  const monthTotal = monthTrades.reduce((s,t) => s+t.amount, 0);
  const wins = yearTrades.filter(t => t.amount > 0).length;
  const losses = yearTrades.filter(t => t.amount < 0).length;
  const total = wins + losses;
  const winRate = total > 0 ? Math.round(wins/total*100) : 0;

  const ht = document.getElementById('homeTotal');
  ht.textContent = fmtYen(yearTotal);
  ht.className = 'card-value ' + colorClass(yearTotal);

  const hm = document.getElementById('homeMonth');
  hm.textContent = fmtYen(monthTotal);
  hm.className = 'card-value ' + colorClass(monthTotal);
  document.getElementById('homeMonthSub').textContent = monthTrades.length + 'トレード';

  const hw = document.getElementById('homeWin');
  hw.textContent = winRate + '%';
  hw.className = 'card-value ' + colorClass(winRate - 50);
  document.getElementById('homeWinSub').textContent = `${wins}勝 ${losses}敗`;

  const list = document.getElementById('recentList');
  const recent = trades.slice(0, 10);
  if (recent.length === 0) {
    list.innerHTML = '<div class="empty-msg">まだ記録がありません</div>';
    return;
  }
  list.innerHTML = recent.map(t => `
    <div class="trade-item">
      <div class="trade-pair">${t.pair}</div>
      <div class="trade-info">
        <div class="trade-date">${t.date}</div>
        ${t.memo ? `<div class="trade-memo">${t.memo}</div>` : ''}
      </div>
      <div class="trade-amount ${colorClass(t.amount)}">${fmtYen(t.amount)}</div>
      <button class="trade-delete" data-id="${t.id}">×</button>
    </div>
  `).join('');

  list.querySelectorAll('.trade-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (confirm('削除しますか？')) {
        await deleteTrade(Number(btn.dataset.id));
        renderHome();
        showToast('削除しました');
      }
    });
  });
}

// ---- ENTRY ----
const entryDateEl = document.getElementById('entryDate');
const todayStr = today.toISOString().split('T')[0];
entryDateEl.value = todayStr;

document.getElementById('amountMinus').addEventListener('click', () => {
  const el = document.getElementById('entryAmount');
  const v = parseInt(el.value || '0');
  el.value = v - 1000;
});
document.getElementById('amountPlus').addEventListener('click', () => {
  const el = document.getElementById('entryAmount');
  const v = parseInt(el.value || '0');
  el.value = v + 1000;
});

document.getElementById('btnSave').addEventListener('click', async () => {
  const date = document.getElementById('entryDate').value;
  const pair = document.getElementById('entryPair').value;
  const amount = parseInt(document.getElementById('entryAmount').value);
  const memo = document.getElementById('entryMemo').value.trim();

  if (!date) { showToast('日付を入力してください'); return; }

  document.getElementById('entryMemo').value = '';

// ---- CALENDAR ----
let calYear = today.getFullYear();
let calMonth = today.getMonth() + 1;

document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 1) { calMonth = 12; calYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  renderCalendar();
});

async function renderCalendar() {
  const trades = await getAllTrades();
  const monthStr = `${calYear}-${String(calMonth).padStart(2,'0')}`;
  const monthTrades = trades.filter(t => t.date.startsWith(monthStr));

  document.getElementById('calTitle').textContent = `${calYear}/${String(calMonth).padStart(2,'0')}`;

  // Monthly total
  const monthTotal = monthTrades.reduce((s,t) => s+t.amount, 0);
  const totalEl = document.getElementById('calTotal');
  totalEl.textContent = fmtYen(monthTotal);
  totalEl.className = 'cal-monthly-total ' + colorClass(monthTotal);
  const wins = monthTrades.filter(t => t.amount > 0).length;
  const losses = monthTrades.filter(t => t.amount < 0).length;
  document.getElementById('calSub').textContent = `${monthTrades.length}トレード　${wins}勝 ${losses}敗`;

  // Day map
  const dayMap = {};
  for (const t of monthTrades) {
    const d = parseInt(t.date.split('-')[2]);
    dayMap[d] = (dayMap[d] || 0) + t.amount;
  }

  // Build calendar
  const firstDay = new Date(calYear, calMonth-1, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const todayDay = (today.getFullYear() === calYear && today.getMonth()+1 === calMonth) ? today.getDate() : -1;

  const body = document.getElementById('calBody');
  body.innerHTML = '';

  let day = 1;
  let week = 1;

  for (let row = 0; row < 6; row++) {
    if (day > daysInMonth) break;

    const rowEl = document.createElement('div');
    rowEl.className = 'cal-row';

    let weekTotal = 0;
    let hasDay = false;

    for (let col = 0; col < 7; col++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';

      const isFirst = row === 0 && col < firstDay;
      const isLast = day > daysInMonth;

      if (!isFirst && !isLast) {
        hasDay = true;
        if (day === todayDay) cell.classList.add('today');

        const dayDiv = document.createElement('div');
        dayDiv.className = 'cal-day';
        dayDiv.textContent = day;
        cell.appendChild(dayDiv);

        if (dayMap[day] !== undefined) {
          weekTotal += dayMap[day];
          const amtDiv = document.createElement('div');
          amtDiv.className = 'cal-amount ' + colorClass(dayMap[day]);
          // 小さい表示: +1,234 形式
          const v = dayMap[day];
          const abs = Math.abs(v);
          let disp;
          if (abs >= 10000) {
            disp = (v >= 0 ? '+' : '-') + Math.round(abs/1000) + 'k';
          } else {
            disp = (v >= 0 ? '+' : '-') + abs.toLocaleString();
          }
          amtDiv.textContent = disp;
          cell.appendChild(amtDiv);
        }
        day++;
      }

      rowEl.appendChild(cell);
    }

    // Week total cell（不要だった重複代入を削除し、シンプルな1回だけの組み立てに整理）
    const weekCell = document.createElement('div');
    weekCell.className = 'cal-week-cell';
    if (hasDay) {
      weekCell.innerHTML = `
        <div class="cal-week-label">W${week}</div>
        <div class="cal-week-amount ${colorClass(weekTotal)}">${weekTotal === 0 ? '–' : fmtYen(weekTotal)}</div>
      `;
      week++;
    }
    rowEl.appendChild(weekCell);
    body.appendChild(rowEl);
  }

  // Pair breakdown
  const pairMap = {};
  for (const t of monthTrades) {
    if (!pairMap[t.pair]) pairMap[t.pair] = { total: 0, wins: 0, losses: 0 };
    pairMap[t.pair].total += t.amount;
    if (t.amount > 0) pairMap[t.pair].wins++;
    else pairMap[t.pair].losses++;
  }

  const breakdown = document.getElementById('pairBreakdown');
  const pairs = Object.entries(pairMap).sort((a,b) => b[1].total - a[1].total);
  if (pairs.length === 0) {
    breakdown.innerHTML = '<div class="empty-msg">データなし</div>';
  } else {
    breakdown.innerHTML = pairs.map(([pair, s]) => `
      <div class="pair-row">
        <div>
          <div class="pair-name">${pair}</div>
          <div class="pair-stats">${s.wins+s.losses}回　${s.wins}勝${s.losses}敗</div>
        </div>
        <div class="pair-amount ${colorClass(s.total)}">${fmtYen(s.total)}</div>
      </div>
    `).join('');
  }
}

// ---- EMAIL GATE ----
// 送信先: rakutore-api に /api/leads を追加する想定（末尾のバックエンド実装例を参照）
const LEADS_ENDPOINT = 'https://api.rakutore.jp/api/leads';
const EMAIL_STORAGE_KEY = 'moneylog_registered_email';

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function initEmailGate() {
  const savedEmail = localStorage.getItem(EMAIL_STORAGE_KEY);
  if (savedEmail) return; // 登録済みなら何もしない

  const gate = document.getElementById('emailGate');
  gate.classList.add('show');

  const emailInput = document.getElementById('gateEmail');
  const errorEl = document.getElementById('gateError');
  const submitBtn = document.getElementById('gateSubmit');

  submitBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!isValidEmail(email)) {
      errorEl.textContent = 'メールアドレスの形式が正しくありません';
      return;
    }
    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    // 先にローカルへ保存 → API側が未整備/通信失敗でも利用をブロックしない（フェイルオープン）
    localStorage.setItem(EMAIL_STORAGE_KEY, email);

    try {
      await fetch(LEADS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, source: 'money-log' })
      });
    } catch (e) {
      console.warn('leads送信に失敗しましたが、アプリの利用は継続します', e);
    }

    gate.classList.remove('show');
  });

  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitBtn.click();
  });
}

// ---- INIT ----
initEmailGate();
initDB().then(() => {
  renderHome();
});
